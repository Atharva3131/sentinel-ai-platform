name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: sentinel-ai-rg
  AZURE_CONTAINER_APP: sentinel-api
  AZURE_ACR: sentinelacr20261003
  IMAGE_NAME: sentinel-api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "$AZURE_ACR" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_ACR.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      - name: Verify deployment
        run: |
          echo "Deployed commit: ${{ github.sha }}"

          az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            -o tsv

          echo "Checking application health..."

          URL=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)

          for i in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "https://$URL/health" > /dev/null; then
              echo "Health check passed."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 10
          done

          echo "Health check failed."
          exit 1
